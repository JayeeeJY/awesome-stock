name: Owner checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Scan checked-out source for secrets
        run: docker run --rm --network none -v "$PWD":/target:ro aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f fs --scanners secret --exit-code 1 /target
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts --prefix frontend/owner-ui
      - run: npm audit --audit-level=high --prefix frontend/owner-ui
      - run: npm run build --prefix frontend/owner-ui
      - name: Owner contracts and archive checks
        env:
          PYTHONPATH: backend/src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -p no:cacheprovider tests/owner tests/install/test_owner_package.py tests/install/test_owner_archive_audit.py tests/install/test_owner_release_tree.py
      - name: Native source install, restart and restore (not a Linux support claim)
        run: python tests/install/verify_owner_delivery.py
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Shipped Vue interface acceptance
        run: npm run test:vue
      - name: Planning and allocation acceptance
        run: npm run test:planning
      - name: Diagnosis acceptance
        run: npm run test:diagnosis
      - name: Market, company and news acceptance
        run: |
          npm run test:public-market
          npm run test:market-history
          npm run test:market-history-flat
          npm run test:market-history-full
          npm run test:china-market
          npm run test:hk-market
          npm run test:company
          npm run test:news
      - name: Portfolio, cockpit and diagnosis source acceptance
        run: |
          npm run test:portfolio-fx
          npm run test:cockpit-fx
          npm run test:snapshot-trend
          npm run test:diagnosis-sources
          npm run test:diagnosis-portfolio
      - name: Messages and appearance acceptance
        run: |
          npm run test:messages
          npm run test:settings-appearance
      - name: Model configuration and explicit connection test (isolated fixture)
        run: npm run test:connections
      - name: Daily AI explicit consent browser flow (isolated fixture)
        run: npm run test:daily-ai
      - name: BYOK batch preview, retry, pause and long-draft browser flows (isolated fixture)
        run: npm run test:batch-ai && npm run test:batch-ai-retry && npm run test:batch-ai-pause
      - name: Legacy interface regression fixture
        run: npm run test:ui
      - run: npm run test:business
      - run: python tools/package_owner.py --output .packages/owner-source.tar.gz
      - run: python tools/audit_owner_package.py .packages/owner-source.tar.gz
